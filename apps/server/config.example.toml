# 复制为 apps/server/config.toml 后按需修改（该文件已在 .gitignore 中）。
# 优先级：环境变量 > apps/server/config.toml > 内置默认值。
# 也可以让 RECIPE_CONFIG 指向任意 TOML 文件。

[server]
# 监听地址与端口；仅本机使用时保持 127.0.0.1。
host = "127.0.0.1"
port = 8080
# 读取机台服务的超时，Go duration 格式，范围 (0, 1m]。
timeout = "5s"

[mock]
# 机台数据服务基地址；当前指向 apps/mockserver，后续替换为真实机台适配层。
url = "http://127.0.0.1:3101"

[database]
# 留空表示不连接数据库；首期读取链路不需要持久化。
# url = "postgres://USER:PASSWORD@127.0.0.1:5432/recipebody?sslmode=disable"
url = ""

[log]
# debug | info | warn | error
level = "info"
# text | json（json 便于日志系统采集）
format = "text"
# stdout | file | both；容器内通常用 stdout
dest = "both"
# 日志根目录，按服务写入 <dir>/<service>/<service>.log
dir = "logs"
# 单个文件超过该大小（MiB）后归档，范围 1..1024
rotate_mb = 10
# 归档目录保留份数，范围 1..100
keep = 5

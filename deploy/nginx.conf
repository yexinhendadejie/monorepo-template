# 静态前端 + 反代：浏览器只访问这一层，API 留在容器网络内。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带哈希的构建产物可以长期缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # nginx 默认只在启动时解析一次上游域名，api 容器重建换了 IP 后会一直 502，
    # 直到重启 web。用 Docker 内置 DNS 加变量形式的 proxy_pass，让每次请求按 TTL 重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    # 变量形式的 proxy_pass 会原样转发请求 URI，/api/ 前缀与 /healthz 路径都不变。
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
